    <style>
      html, body { margin: 0; height: 100%; background: #0b0b0c; overflow: hidden; }
      #loader { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #0b0b0c; color: #f4f4f4; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      #loader .wm { font-size: 18px; font-weight: 600; letter-spacing: 0.7em; margin-right: -0.7em; text-align: center; }
      #loader .sub { margin-top: 14px; font-size: 12px; letter-spacing: 0.3em; color: rgba(255,255,255,0.45); text-transform: uppercase; text-align: center; }
      #loader .start, #loader .note { display: none; }
    </style>

  <body>
    <div id="loader">
      <div class="inner">
        <div class="wm">TESLA</div>
        <div class="sub">Roadster</div>
        <div class="bar"><i></i></div>
        <button class="start" type="button">Start</button>
        <div class="note">Best with sound on</div>
      </div>
    </div>
    <canvas id="scene"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
